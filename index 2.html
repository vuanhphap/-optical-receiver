<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Optical Transfer Receiver v0.3</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
  :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{margin:0;background:#111318;color:#eef1f6}
  main{max-width:980px;margin:auto;padding:14px}
  .card{background:#1a1d24;border:1px solid #303541;border-radius:14px;padding:14px;margin:12px 0}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  button,select{font:inherit;border:1px solid #3a4050;border-radius:9px;padding:9px 11px;background:#242a35;color:#fff}
  canvas{width:100%;height:auto;display:block;background:#000;border-radius:12px;touch-action:none}
  video{display:none}
  pre{white-space:pre-wrap;font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
  .hint{font-size:12px;color:#aeb5c3;line-height:1.5}
  progress{width:100%;height:16px}
</style>
</head>
<body>
<main>
<h2>Optical Transfer Receiver v0.3</h2>
<div class="card">
  <div class="row">
    <button id="camera">Bật camera</button>
    <button id="corners">Căn lại 4 góc</button>
    <button id="reset">Xóa phiên nhận</button>
    <select id="grid"><option value="96x54">96×54</option><option value="128x72" selected>128×72</option><option value="160x90">160×90</option></select>
    <select id="bpc"><option value="1" selected>1 bit/cell</option><option value="2">2 bit/cell</option></select>
  </div>
  <p class="hint">
    Chạm 4 dấu đỏ theo thứ tự: trái trên → phải trên → phải dưới → trái dưới. Giữ máy cố định.
    Receiver chỉ dùng camera, Canvas, IndexedDB và cơ chế lưu file chuẩn của trình duyệt.
  </p>
  <video id="video" playsinline muted></video>
  <canvas id="view" width="960" height="540"></canvas>
</div>
<div class="card">
  <progress id="progress" max="1" value="0"></progress>
  <pre id="status">Chưa bật camera.</pre>
  <button id="save" disabled>Lưu file đã nhận</button>
</div>
</main>

<script>
"use strict";
const MAGIC=0x4F4D4631>>>0,VERSION=1,FRAME_MANIFEST=0,FRAME_DATA=1,BORDER=2,CAL_ROWS=2,HEADER_LEN=26;
const video=document.getElementById("video"),canvas=document.getElementById("view"),
ctx=canvas.getContext("2d",{willReadFrequently:true}),gridEl=document.getElementById("grid"),bpcEl=document.getElementById("bpc"),
statusEl=document.getElementById("status"),progress=document.getElementById("progress"),saveBtn=document.getElementById("save");

function parseGrid(s){const [w,h]=s.split("x").map(Number);return{w,h}}
function geom(w,h){return{x0:BORDER,x1:w-BORDER,calY:BORDER,dataY:BORDER+CAL_ROWS,y1:h-BORDER,cols:w-2*BORDER,rows:h-2*BORDER-CAL_ROWS}}
function get16(a,o){return((a[o]<<8)|a[o+1])>>>0}
function get32(a,o){return(((a[o]<<24)>>>0)|(a[o+1]<<16)|(a[o+2]<<8)|a[o+3])>>>0}
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0}return t})();
function crc32(a){let c=0xFFFFFFFF;for(let i=0;i<a.length;i++)c=CRCT[(c^a[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function symsToBytes(s,bpc){
  const out=new Uint8Array(Math.floor(s.length*bpc/8));let oi=0,acc=0,bits=0;
  for(let i=0;i<s.length;i++){acc=(acc<<bpc)|(s[i]&((1<<bpc)-1));bits+=bpc;if(bits===8){out[oi++]=acc&255;acc=0;bits=0}}
  return out
}
function homography(p0,p1,p2,p3){
  const dx1=p1.x-p2.x,dx2=p3.x-p2.x,dx3=p0.x-p1.x+p2.x-p3.x;
  const dy1=p1.y-p2.y,dy2=p3.y-p2.y,dy3=p0.y-p1.y+p2.y-p3.y;
  const den=dx1*dy2-dx2*dy1;let g=0,h=0;
  if(Math.abs(dx3)>1e-6||Math.abs(dy3)>1e-6){if(Math.abs(den)<1e-9)return null;g=(dx3*dy2-dx2*dy3)/den;h=(dx1*dy3-dx3*dy1)/den}
  const a=p1.x-p0.x+g*p1.x,b=p3.x-p0.x+h*p3.x,c=p0.x,d=p1.y-p0.y+g*p1.y,e=p3.y-p0.y+h*p3.y,f=p0.y;
  return(u,v)=>{const q=g*u+h*v+1;return{x:(a*u+b*v+c)/q,y:(d*u+e*v+f)/q}}
}
function luma(data,w,h,x,y){x=Math.max(0,Math.min(w-1,Math.round(x)));y=Math.max(0,Math.min(h-1,Math.round(y)));const i=(y*w+x)*4;return data[i]*.2126+data[i+1]*.7152+data[i+2]*.0722}

let corners=[];
canvas.addEventListener("pointerdown",e=>{
  const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*canvas.width/r.width,y=(e.clientY-r.top)*canvas.height/r.height;
  if(corners.length>=4)corners=[];corners.push({x,y})
});
document.getElementById("corners").onclick=()=>{corners=[]};

let dbp=null;
function db(){
  if(dbp)return dbp;
  dbp=new Promise((res,rej)=>{const r=indexedDB.open("optical-transfer-v03",1);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("chunks"))d.createObjectStore("chunks",{keyPath:"key"})};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)
  });return dbp
}
async function clearDB(){const d=await db();await new Promise((res,rej)=>{const t=d.transaction("chunks","readwrite");t.objectStore("chunks").clear();t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function putChunk(session,seq,payload){
  const d=await db();const buf=payload.buffer.slice(payload.byteOffset,payload.byteOffset+payload.byteLength);
  await new Promise((res,rej)=>{const t=d.transaction("chunks","readwrite");t.objectStore("chunks").put({key:`${session}:${seq}`,session,seq,data:buf});t.oncomplete=res;t.onerror=()=>rej(t.error)})
}
async function allChunks(session){
  const d=await db();return await new Promise((res,rej)=>{const t=d.transaction("chunks","readonly"),r=t.objectStore("chunks").getAll();
    r.onsuccess=()=>res(r.result.filter(x=>x.session===session).sort((a,b)=>a.seq-b.seq));r.onerror=()=>rej(r.error)
  })
}

let rx={running:false,session:null,meta:null,total:0,set:new Set(),bytes:0,ok:0,bad:0,dup:0,start:performance.now(),last:"-",decode:0,cent:null};
function resetRx(){const running=rx.running;rx={running,session:null,meta:null,total:0,set:new Set(),bytes:0,ok:0,bad:0,dup:0,start:performance.now(),last:"-",decode:0,cent:null};progress.max=1;progress.value=0;saveBtn.disabled=true}
document.getElementById("reset").onclick=async()=>{resetRx();await clearDB();updateUI()};

function decodeFrame(data,cw,ch,gw,gh,bpc){
  if(corners.length!==4)return{ok:false,reason:"calibrate"};
  const map=homography(...corners);if(!map)return{ok:false,reason:"geometry"};
  const g=geom(gw,gh),mod=bpc===1?2:4,sums=new Array(mod).fill(0),cnt=new Array(mod).fill(0);
  for(let gy=g.calY;gy<g.dataY;gy++)for(let gx=g.x0;gx<g.x1;gx++){
    const p=map((gx+.5)/gw,(gy+.5)/gh),y=luma(data,cw,ch,p.x,p.y),s=(gx-g.x0)%mod;sums[s]+=y;cnt[s]++
  }
  const c=sums.map((v,i)=>v/Math.max(1,cnt[i]));
  for(let i=1;i<c.length;i++)if(!(c[i]>c[i-1]+6))return{ok:false,reason:"levels",cent:c};
  function cls(y){let bi=0,bd=1e9;for(let i=0;i<c.length;i++){const d=Math.abs(y-c[i]);if(d<bd){bd=d;bi=i}}return bi}
  const syms=new Uint8Array(g.cols*g.rows);let k=0;
  for(let gy=g.dataY;gy<g.y1;gy++)for(let gx=g.x0;gx<g.x1;gx++){
    const p=map((gx+.5)/gw,(gy+.5)/gh);syms[k++]=cls(luma(data,cw,ch,p.x,p.y))
  }
  const b=symsToBytes(syms,bpc);if(b.length<HEADER_LEN)return{ok:false,reason:"short",cent:c};
  const magic=get32(b,0),ver=b[4],type=b[5],rbpc=b[6],reserved=b[7],session=get32(b,8),seq=get32(b,12),total=get32(b,16),plen=get16(b,20),want=get32(b,22);
  if(magic!==MAGIC||ver!==VERSION||rbpc!==bpc||reserved!==0)return{ok:false,reason:"header",cent:c};
  if(type!==FRAME_MANIFEST&&type!==FRAME_DATA)return{ok:false,reason:"type",cent:c};
  if(HEADER_LEN+plen>b.length)return{ok:false,reason:"length",cent:c};
  const payload=b.slice(HEADER_LEN,HEADER_LEN+plen);if(crc32(payload)!==want)return{ok:false,reason:"crc",cent:c};
  return{ok:true,type,session,seq,total,payload,cent:c}
}

async function handle(r){
  if(r.type===FRAME_MANIFEST){
    let meta;try{meta=JSON.parse(new TextDecoder().decode(r.payload))}catch{rx.bad++;rx.last="manifest-json";return}
    if(rx.session!==r.session){await clearDB();resetRx();rx.session=r.session;rx.meta=meta;rx.total=r.total;rx.start=performance.now();progress.max=Math.max(1,rx.total)}
    else if(!rx.meta){rx.meta=meta;rx.total=r.total}
    rx.ok++;rx.last="manifest";return
  }
  if(rx.session===null||!rx.meta){rx.last="waiting-manifest";return}
  if(r.session!==rx.session||r.total!==rx.total||r.seq>=rx.total){rx.bad++;rx.last="session/seq";return}
  if(rx.set.has(r.seq)){rx.dup++;rx.last="duplicate";return}
  rx.set.add(r.seq);rx.bytes+=r.payload.length;rx.ok++;rx.last="data";progress.value=rx.set.size;
  putChunk(rx.session,r.seq,r.payload).catch(()=>{rx.bad++;rx.last="storage"});
  if(rx.set.size===rx.total)saveBtn.disabled=false
}

function overlay(){
  ctx.save();ctx.lineWidth=3;ctx.font="18px sans-serif";const lab=["TL","TR","BR","BL"];
  corners.forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x,p.y,10,0,Math.PI*2);ctx.strokeStyle="#00ff88";ctx.stroke();ctx.fillStyle="#00ff88";ctx.fillText(lab[i],p.x+12,p.y-8)});
  if(corners.length===4){ctx.beginPath();ctx.moveTo(corners[0].x,corners[0].y);for(let i=1;i<4;i++)ctx.lineTo(corners[i].x,corners[i].y);ctx.closePath();ctx.strokeStyle="#00ff88";ctx.stroke()}
  ctx.restore()
}
function updateUI(){
  const sec=Math.max(.001,(performance.now()-rx.start)/1000),rate=rx.bytes/1024/sec,pct=rx.total?100*rx.set.size/rx.total:0;
  statusEl.textContent=`corners: ${corners.length}/4
file: ${rx.meta?rx.meta.name:"-"}
progress: ${rx.set.size}/${rx.total||"-"} (${pct.toFixed(2)}%)
verified: ${(rx.bytes/1024/1024).toFixed(2)} MiB
throughput: ${rate.toFixed(1)} KiB/s
accepted/rejected/duplicate: ${rx.ok}/${rx.bad}/${rx.dup}
decode: ${rx.decode.toFixed(1)} ms
luma: ${rx.cent?rx.cent.map(x=>x.toFixed(0)).join("/"):"-"}
last: ${rx.last}`
}

let busy=false,lastUI=0;
function process(){
  if(!rx.running||busy||video.readyState<2)return;busy=true;
  try{
    const W=960,aspect=video.videoWidth/video.videoHeight||16/9;canvas.width=W;canvas.height=Math.round(W/aspect);
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    const img=ctx.getImageData(0,0,canvas.width,canvas.height),{w:gw,h:gh}=parseGrid(gridEl.value),bpc=+bpcEl.value,t0=performance.now();
    const r=decodeFrame(img.data,canvas.width,canvas.height,gw,gh,bpc);rx.decode=performance.now()-t0;rx.cent=r.cent||null;
    if(r.ok)handle(r);else if(r.reason!=="calibrate"){rx.bad++;rx.last=r.reason}else rx.last="calibrate";
    ctx.drawImage(video,0,0,canvas.width,canvas.height);overlay();
    if(performance.now()-lastUI>250){updateUI();lastUI=performance.now()}
  }finally{busy=false}
}
function loop(){if(!rx.running)return;if("requestVideoFrameCallback"in HTMLVideoElement.prototype)video.requestVideoFrameCallback(()=>{process();loop()});else{process();requestAnimationFrame(loop)}}

document.getElementById("camera").onclick=async()=>{
  try{
    if(!window.isSecureContext)throw new Error("iPhone Safari yêu cầu HTTPS.");
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:60,max:60}},audio:false});
    video.srcObject=stream;await video.play();rx.running=true;rx.start=performance.now();loop()
  }catch(e){statusEl.textContent="Camera error: "+e}
};

saveBtn.onclick=async()=>{
  if(!rx.meta||rx.set.size!==rx.total)return;
  saveBtn.disabled=true;saveBtn.textContent="Đang ghép...";
  try{
    const rows=await allChunks(rx.session);if(rows.length!==rx.total)throw new Error("Thiếu chunk.");
    const blob=new Blob(rows.map(x=>x.data),{type:rx.meta.type||"application/octet-stream"});
    if(blob.size!==rx.meta.size)throw new Error("Sai kích thước file.");
    const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=(rx.meta.name||"received.bin").replace(/[\\/:*?"<>|]/g,"_");document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000)
  }catch(e){alert(e)}finally{saveBtn.disabled=false;saveBtn.textContent="Lưu file đã nhận"}
};

if("serviceWorker"in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
